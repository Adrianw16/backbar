spring:
  application:
    name: backbar
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/backbar}
    username: ${DB_USER:backbar}
    password: ${DB_PASSWORD:backbar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

logging:
  level:
    org.flywaydb: info